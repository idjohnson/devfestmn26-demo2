apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medical-pdf-summarizer.fullname" . }}-config
  labels:
    {{- include "medical-pdf-summarizer.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.app.port | quote }}
  OLLAMA_URL: {{ .Values.app.ollama.url | quote }}
  OLLAMA_MODEL_FAST: {{ .Values.app.ollama.modelFast | quote }}
  OLLAMA_MODEL_DETAILED: {{ .Values.app.ollama.modelDetailed | quote }}
  MAX_CHARS: {{ .Values.app.maxChars | default 24000 | quote }}

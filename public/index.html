<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medical PDF Summarizer</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    pre { white-space: pre-wrap; background: #f8f9fa; padding: 1rem; border-radius: 4px; border: 1px solid #e9ecef; }
    button { cursor: pointer; padding: 0.4rem 0.8rem; }
    #actions { margin: 1rem 0; display: none; }
  </style>
</head>
<body>
  <h1>Medical PDF Summarizer</h1>
  <form id="f">
    <input type="file" name="pdf" accept="application/pdf" required>
    <button type="submit">Summarize</button>
  </form>
  <p id="status"></p>
  <pre id="out"></pre>
  <div id="actions">
    <button id="downloadBtn" type="button">Download Summary</button>
  </div>
  <p><small>For informational purposes only; not medical advice.</small></p>
  <script>
    const f = document.getElementById('f'),
          s = document.getElementById('status'),
          o = document.getElementById('out'),
          actions = document.getElementById('actions'),
          downloadBtn = document.getElementById('downloadBtn');

    let currentSummary = '';
    let downloadFileName = 'summary.txt';

    f.addEventListener('submit', async e => {
      e.preventDefault();
      s.textContent = 'Summarizing...';
      o.textContent = '';
      actions.style.display = 'none';
      currentSummary = '';

      const fileInput = f.querySelector('input[type="file"]');
      const file = fileInput && fileInput.files ? fileInput.files[0] : null;
      if (file && file.name) {
        const baseName = file.name.replace(/\.[^/.]+$/, '');
        downloadFileName = `${baseName}-summary.txt`;
      } else {
        downloadFileName = 'summary.txt';
      }

      try {
        const r = await fetch('/api/summarize', { method: 'POST', body: new FormData(f) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        s.textContent = d.truncated ? 'Note: document was truncated.' : '';
        o.textContent = d.summary;
        currentSummary = d.summary;
        if (currentSummary) {
          actions.style.display = 'block';
        }
      } catch (err) {
        s.textContent = 'Error: ' + err.message;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentSummary) return;
      const blob = new Blob([currentSummary], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = downloadFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
